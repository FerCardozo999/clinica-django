{# Card de una especialidad. Recibe la variable "especialidad". #}
<div class="card card-genesis h-100">
    <div class="card-body p-4">
        <i class="bi {{ especialidad.icono }} card-genesis__icono"></i>
        <h3 class="h5 card-genesis__titulo mt-3">{{ especialidad.nombre }}</h3>
        <p class="card-text text-muted">
            {{ especialidad.descripcion|truncatewords:15 }}
        </p>
        <a href="{% url 'clinica:especialidad_detalle' especialidad.slug %}"
           class="card-genesis__link stretched-link">
            Ver más <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</div>
