{% extends "base.html" %}

{% block title %}Página no encontrada | Génesis Salud{% endblock %}

{% block content %}
<section class="seccion seccion--suave">
    <div class="container">
        <div class="seccion__encabezado">
            <p class="seccion__etiqueta">Error 404</p>
            <h1 class="seccion__titulo">Página no encontrada</h1>
            <p class="seccion__texto">
                La página que buscás no existe o cambió de dirección.
                Revisá el enlace o volvé al inicio para seguir navegando.
            </p>
            <a href="{% url 'core:inicio' %}" class="btn btn-genesis mt-4">
                Volver al inicio
            </a>
        </div>
    </div>
</section>
{% endblock %}
