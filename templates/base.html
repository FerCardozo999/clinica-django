{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Genesis Salud: atencion medica en multiples especialidades y turnos online" />
    <title>{% block title %}Genesis Salud{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <!-- Fuente: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />

    <!-- Fuente propia -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-dark navbar-genesis" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="{%url 'core:inicio' %}">Genesis Salud</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abir menu">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'core:inicio' %}">Inicio</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-grow-1">{% block content %}{% endblock %}</main>

    <footer class="bg-dark text-white py-4 footer-genesis">
      <div class="container text-center">
        <p class="mb-1 fw-bold">Genesis Salud</p>
        <p class="mb-1 small">Donde empieza tu bienestar · Salta, Argentina</p>
        <p class="mb-0 small">&copy; {%now "Y" %} Genesis Salud</p>
      </div>
    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
